<div class="row px-5 pt-4">
    <div class="col-6">
        <h3>Nuevo Pedido</h3>
    </div>
    <div class="col-1">
        <h3>Estado: </h3>
    </div>
    <div class="col-2">
        <h3 class="text-success">{{ obtenerEstado() }}</h3>
    </div>
    <div class="col-3">
        <button type="button" class="btn btn-success w-100 rounded-3" (click)="avanzarEstado()">Avanzar a {{ obtenerSiguienteEstado() }}</button>
    </div>
    <form [formGroup]="pedidoForm" (ngSubmit)="onSubmit()" class="mt-3">
        <div class="mb-3">
            <input class="form-control bg-body-secondary" placeholder="Nombre cliente" formControlName="cliente" />
            <div class="error-feedback" *ngIf="esInvalido('cliente')">
                El cliente es obligatorio
            </div>
        </div>
        <div class="mb-3">
            <input type="date" class="form-control bg-body-secondary" placeholder="Fecha máxima de entrega" formControlName="entregaMax" />
        </div>
        <div class="row my-5">
            <div class="col-3">
                <h4>Lineas del pedido</h4>
            </div>
            <div class="col-3">
                <button type="button" class="btn btn-primary w-100" (click)="agregarLineaPedido()">Agregar</button>
            </div>
            <div formArrayName="lineasPedido">
                <div *ngFor="let linea of lineasPedido.controls; let i = index" [formGroupName]="i" class="row mt-3">
                    <div class="col-4">
                        <input class="form-control bg-body-secondary" placeholder="Articulo" formControlName="articulo" />
                        <div class="error-feedback" *ngIf="esInvalido('articulo', i)">
                            El articulo es obligatorio.
                        </div>
                    </div>
                    <div class="col-2">
                        <input type="number" class="form-control bg-body-secondary" placeholder="Cantidad" formControlName="cantidad" />
                        <div *ngIf="esInvalido('cantidad', i)" class="error-feedback">
                            La cantidad es obligatoria.
                        </div>
                    </div>
                    <div class="col-2">
                        <input class="form-control bg-body-secondary" placeholder="Color tinta" formControlName="tinta" />
                    </div>
                    <div class="col-3">
                        <input class="form-control bg-body-secondary" placeholder="Situación de la grabación" formControlName="situacionGrabacion" />
                    </div>
                    <div class="col-1">
                        <button type="button" class="btn btn-danger w-100" (click)="eliminarLineaPedido(i)">Eliminar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-success w-100 rounded-3">
                {{ this.id == -1 ? 'Crear Pedido' : 'Actualizar Pedido' }}
            </button>
        </div>
    </form>
</div>
