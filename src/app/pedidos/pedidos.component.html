<div class="row px-5 g-4">
    <div class="row mt-4 g-4">
        <div class="col-8">
            <h2 class="text-success">Pedidos</h2>
        </div>
        <div class="col-4">
            <a class="btn btn-success w-100" [routerLink]="['/crearPedido', -1]">Nuevo pedido</a>
        </div>
    </div>
    <div class="container mt-4">
        <div class="mb-3">
            <input type="text"
                   class="form-control"
                   placeholder="Buscar pedidos"
                   [(ngModel)]="filtro"
                   (ngModelChange)="aplicarFiltro()" />
        </div>
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Entrega máxima</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let pedido of pedidosFiltrados">
                    <td><a [routerLink]="['/crearPedido', pedido.id]" class="d-block text-decoration-none text-dark">{{ pedido.id }}</a></td>
                    <td>
                        <a [routerLink]="['/crearPedido', pedido.id]" class="d-block text-decoration-none text-dark">
                            {{ pedido.cliente }}
                            <div *ngFor="let linea of pedido.lineasPedido" class="ms-3 small text-muted">
                                {{ linea.cantidad }} {{ linea.articulo }}
                            </div>
                        </a>
                    </td>
                    <td><a [routerLink]="['/crearPedido', pedido.id]" class="d-block text-decoration-none text-dark">{{ pedido.estado }}</a></td>
                    <td><a [routerLink]="['/crearPedido', pedido.id]" class="d-block text-decoration-none text-dark">{{ pedido.entregaMax ? (pedido.entregaMax | date:'dd/MM/yyyy') : '-' }}</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
